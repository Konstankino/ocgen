# mezha.toml: the single source for this project's .claude/ setup.
# Edit this file, then run `mezha compile`. Files mezha generates are
# fingerprinted; hand edits to them are kept and reported, never overwritten
# silently.

[project]
name = "ocgen"
os_mode = "full"
check = "cargo test --locked --all-targets --no-fail-fast"

[policy]
sandbox = true
# The sparse index and crate downloads only: no crates.io API, no forge.
egress_allow = ["index.crates.io", "static.crates.io"]
permissions_ask = ["git push"]
deny_reads = [".env", "*.pem", "*.key"]

[memory]
dream_schedule = "nightly"
dream_at = "03:00"
default_scope = "project"

[agent.implementer]
description = "Implements one scoped change in ocgen (feature, fix, refactor or test) and runs the affected tests. Use for coding tasks in this repository."
model = "sonnet"
tools = ["Read", "Grep", "Glob", "Edit", "Write", "Bash(cargo *)", "Bash(git diff *)", "Bash(git status *)", "Bash(git log *)"]
rule_of_two = ["untrusted_input", "private_data"]
memory = { scope = "project" }
max_turns = 60

[agent.explorer]
description = "Answers questions about ocgen's code with file:line evidence. Use before changing unfamiliar code, or when asked where or how something works."
model = "haiku"
tools = ["Read", "Grep", "Glob"]
rule_of_two = ["private_data"]
memory = { scope = "project", dream_policy = "verified-facts" }
max_turns = 30
