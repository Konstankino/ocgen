[package]
name = "ocgen"
version = "0.7.1"
edition = "2021"
description = "Interactive bootstrapper for LLM multi-agent projects (OpenCode, Claude Code)"
license = "MIT"
# Used by the installers and `cargo install --git`.
repository = "https://github.com/Konstankino/ocgen"
homepage = "https://github.com/Konstankino/ocgen"
readme = "README.md"

[[bin]]
name = "ocgen"
path = "src/main.rs"

# Small, fast release binaries for distribution.
[profile.release]
strip = true
lto = true
codegen-units = 1

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
console = "0.15"
dialoguer = { version = "0.11", features = ["editor"] }
dirs = "6"
minijinja = "2"
regex = "1"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
toml = "0.8"
