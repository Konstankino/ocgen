[package]
name = "ocgen"
version = "0.9.1"
edition = "2021"
description = "Interactive bootstrapper for LLM multi-agent projects (OpenCode, Claude Code)"
license = "MIT"
# Used by the installers and `cargo install --git`.
repository = "https://github.com/Konstankino/ocgen"
homepage = "https://github.com/Konstankino/ocgen"
readme = "README.md"

[[bin]]
name = "ocgen"
path = "src/main.rs"

# Small, fast release binaries for distribution.
[profile.release]
strip = true
lto = true
codegen-units = 1

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
console = "0.15"
dialoguer = { version = "0.11", features = ["editor"] }
dirs = "6"
minijinja = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# The hooks' sandbox: wasmtime runs a WASI command where no OS sandbox can.
wasmtime = { version = "49", default-features = false, features = ["cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "49", default-features = false, features = ["p1"] }

# Landlock, with seccomp for the network, when bubblewrap can't run.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
libc = "0.2"
seccompiler = "0.5"

# AppContainer and job objects.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[dev-dependencies]
wat = "1"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
toml = "0.8"
