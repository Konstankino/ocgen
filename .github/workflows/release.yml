name: Release

# Publish binaries for Windows, macOS and Linux whenever you push a version tag.
#   git tag v0.2.0 && git push --tags
# Re-runnable by hand from the Actions tab (workflow_dispatch).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    ext: ".exe", archive: zip }
          - { os: macos-latest,   target: aarch64-apple-darwin,      ext: "",     archive: tar }
          - { os: macos-latest,   target: x86_64-apple-darwin,       ext: "",     archive: tar }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl, ext: "",     archive: tar }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Version from tag
        # The binary reports the tag's version (vX.Y.Z → X.Y.Z), so every release
        # bumps `ocgen --version` without editing Cargo.toml. A manual run that
        # isn't on a tag keeps Cargo.toml's version.
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::notice::not a tag build — using Cargo.toml's version"
            exit 0
          fi
          v="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::'$GITHUB_REF_NAME' is not a version tag (expected vX.Y.Z)"
            exit 1
          fi
          echo "OCGEN_BUILD_VERSION=$v" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --bin ocgen --target ${{ matrix.target }}

      - name: Check the version
        # Native builds only (the x86_64 macOS binary is cross-built on Apple silicon).
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          out="$("target/${{ matrix.target }}/release/ocgen${{ matrix.ext }}" --version)"
          echo "$out"
          want="${OCGEN_BUILD_VERSION:-$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)}"
          [ "$out" = "ocgen $want" ] || { echo "::error::expected 'ocgen $want', got '$out'"; exit 1; }

      - name: Package
        shell: bash
        run: |
          name="ocgen-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir dist
          cp "target/${{ matrix.target }}/release/ocgen${{ matrix.ext }}" dist/
          cp README.md dist/ 2>/dev/null || true
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../${name}.zip" ./*
            echo "ASSET=${name}.zip" >> "$GITHUB_ENV"
          else
            tar czf "../${name}.tar.gz" ./*
            echo "ASSET=${name}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
