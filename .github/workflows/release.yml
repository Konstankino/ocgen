name: Release

# Publish binaries for Windows, macOS and Linux whenever you push a version tag.
#   git tag v0.2.0 && git push --tags
# Re-runnable by hand from the Actions tab (workflow_dispatch); a run that isn't
# on a tag builds everything but publishes nothing.
#
# Every release carries SHA256SUMS (one line per archive), which the installers
# check before installing. Third-party actions are pinned to commit SHAs (the
# version is in the trailing comment), and only the publish job, which runs no
# build, can write to the repository.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,     ext: ".exe", archive: zip }
          - { os: macos-latest,     target: aarch64-apple-darwin,       ext: "",     archive: tar }
          - { os: macos-latest,     target: x86_64-apple-darwin,        ext: "",     archive: tar }
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl,  ext: "",     archive: tar }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, ext: "",     archive: tar }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Version from tag
        # The binary reports the tag's version (vX.Y.Z → X.Y.Z), so every release
        # bumps `ocgen --version` without editing Cargo.toml. A manual run that
        # isn't on a tag keeps Cargo.toml's version.
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::notice::not a tag build — using Cargo.toml's version"
            exit 0
          fi
          v="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::'$GITHUB_REF_NAME' is not a version tag (expected vX.Y.Z)"
            exit 1
          fi
          echo "OCGEN_BUILD_VERSION=$v" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --bin ocgen --target ${{ matrix.target }}

      - name: Check the version
        # Native builds only (the x86_64 macOS binary is cross-built on Apple silicon).
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          out="$("target/${{ matrix.target }}/release/ocgen${{ matrix.ext }}" --version)"
          echo "$out"
          want="${OCGEN_BUILD_VERSION:-$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)}"
          [ "$out" = "ocgen $want" ] || { echo "::error::expected 'ocgen $want', got '$out'"; exit 1; }

      - name: Package
        shell: bash
        run: |
          name="ocgen-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir dist
          cp "target/${{ matrix.target }}/release/ocgen${{ matrix.ext }}" dist/
          cp README.md dist/ 2>/dev/null || true
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../${name}.zip" ./*
            echo "ASSET=${name}.zip" >> "$GITHUB_ENV"
          else
            tar czf "../${name}.tar.gz" ./*
            echo "ASSET=${name}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Keep the archive for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archive-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    # All targets or none: SHA256SUMS lists every archive of the release.
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect the archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum ocgen-* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/ocgen-*
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
