name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Third-party actions are pinned to commit SHAs (the version is in the trailing
# comment); nothing here needs to write to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A new push to a pull request cancels its run still in progress; runs on main
# always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The hooks' sandbox each runner must use (tests/hook_sandbox.rs checks;
        # native Windows has none, and refuses).
        include:
          - { name: ubuntu-latest, os: ubuntu-latest, sandbox: bwrap }
          - { name: ubuntu-latest landlock, os: ubuntu-latest, sandbox: landlock }
          - { name: macos-latest, os: macos-latest, sandbox: seatbelt }
          - { name: windows-latest, os: windows-latest, sandbox: none }
    env:
      OCGEN_TEST_SANDBOX_EXPECT: ${{ matrix.sandbox }}
      OCGEN_TEST_NETWORK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes the cache: pull requests restore it without the
          # minutes saving takes, and can't evict main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Sandbox (bubblewrap with user namespaces)
        if: matrix.sandbox == 'bwrap'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Sandbox (Landlock only — no bubblewrap, user namespaces restricted)
        if: matrix.sandbox == 'landlock'
        run: |
          sudo apt-get remove -y bubblewrap || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1 || true
      - name: The hooks' sandbox, first
        run: cargo test --locked --test hook_sandbox -- --nocapture --test-threads=1
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest@0.9.146
      - name: Test
        # Every test binary's tests in one pool (.config/nextest.toml), all but
        # the hooks' sandbox, which ran above.
        run: cargo nextest run --locked --all-targets --profile ci -E 'not binary(hook_sandbox)'

  lint:
    name: fmt + clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Most of the sandbox code is per OS.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes the cache: pull requests restore it without the
          # minutes saving takes, and can't evict main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,     ext: ".exe" }
          - { os: macos-latest,     target: aarch64-apple-darwin,       ext: "" }
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl,  ext: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, ext: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes the cache: pull requests restore it without the
          # minutes saving takes, and can't evict main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        # This only checks that a release build works, so without LTO and with
        # parallel codegen: minutes faster. The release workflow builds with
        # the full profile (fat LTO, one codegen unit), which is smaller.
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release --locked --bin ocgen --target ${{ matrix.target }}
      - name: Binary size (larger than a release's, which has LTO)
        shell: bash
        run: ls -l target/${{ matrix.target }}/release/ocgen${{ matrix.ext }}
      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocgen-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/ocgen${{ matrix.ext }}
          if-no-files-found: error
