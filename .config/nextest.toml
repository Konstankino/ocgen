# cargo-nextest settings (https://nexte.st). It runs the tests of every test
# binary in one pool, where `cargo test` runs the binaries one after another; on
# Windows a few slow binaries otherwise wait for each other. CI runs
# `cargo nextest run --profile ci`.

[profile.ci]
# Report every failing test, not just the first.
fail-fast = false
# Show a failure's output where it happens and again in the summary.
failure-output = "immediate-final"
# Name a test still running after a minute; stop it after ten.
slow-timeout = { period = "60s", terminate-after = 10 }
