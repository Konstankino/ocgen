# `cargo cov` reports coverage of the testable code. Every prompt goes through
# src/prompt.rs, which tests can script (see `prompt::script`), so the skill and
# MCP flows (src/wizard/skill.rs, src/wizard/mcp.rs) are covered by scripted
# wizard tests. src/wizard/mod.rs — the long `new`/agent/provider flows — is
# still excluded until scripted tests cover it.
[alias]
cov = "llvm-cov --ignore-filename-regex wizard/mod\\.rs"
cov-all = "llvm-cov"

# Note: do not commit a `[build] target-dir` here — an absolute path breaks CI,
# `cargo install --git`, and other machines. For a slow/networked checkout, set
# the target dir per-shell instead:  export CARGO_TARGET_DIR=/path/on/local/disk
