# ocgen template manifest.
# Declares the project-level questions the wizard asks, the default provider(s)
# and their models, and the default primary/utility models.
#
# Editable: copy this whole templates/ dir out with `ocgen templates init`
# (into ~/.config/ocgen/templates/) and change anything below.

[[variable]]
key = "project_name"
prompt = "Project name"
help = "A label for this project; not written into the generated files."
default = "my-project"

# Two languages: the agents' instructions, and their answers to you. English
# instructions are followed most precisely and cost the fewest tokens; when the
# answer language differs, the coordinator is told to answer in it (and a Claude
# project's settings.json gets Claude Code's `language`).
[[variable]]
key = "language"
prompt = "Instruction language"
help = "Language of the agents' instructions. English is followed most precisely and costs fewer tokens."
type = "select"
choices = ["English", "Ukrainian"]
default = "English"

[[variable]]
key = "response_language"
prompt = "Answer language"
help = "Language the agents answer you in. Subagents still report to the coordinator in the instruction language."
type = "select"
choices = ["Ukrainian", "English"]
default = "Ukrainian"

# One or more providers. The wizard seeds the provider loop with these; you can
# edit them, add more, and assign a provider to each agent. Each provider becomes
# a "provider.<key>" entry in opencode.json.
[[provider]]
key = "mac"
name = "M4 Pro 24GB"
npm = "@ai-sdk/openai-compatible"
base_url = "http://mac.home:8080/v1"

# Model ids must match what the server exposes (see `GET <base_url>/models`).
# llama-swap aliases (e.g. "qwen-coder") are NOT ids — use the canonical id.
[[provider.models]]
id = "qwen3.5-9b"
name = "Qwen3.5 9B"

[[provider.models]]
id = "gemma-26b"
name = "Gemma 26B"

[[provider.models]]
id = "qwen3-35b-a3b"
name = "Qwen3 35B A3B"

[[provider.models]]
id = "qwen3-coder-30b"
name = "Qwen3 Coder 30B"

[[provider.models]]
id = "devstral-24b"
name = "Devstral 24B"

[[provider.models]]
id = "qwen38-27b"
name = "Qwen38 27B"

# The default team the wizard offers to seed. Each entry names an agent and the
# archetype (archetypes/<archetype>.toml) it starts from. Reorder, rename, add or
# remove entries — or delete the whole section for no default team — to retarget
# ocgen at any domain without touching code.
[[pipeline]]
name = "coordinator"
archetype = "coordinator"

[[pipeline]]
name = "explorer"
archetype = "explorer"

[[pipeline]]
name = "implementer"
archetype = "implementer"

# Checks the change against the plan in both directions — nothing planned
# missing, nothing unplanned added — and states its blast radius. With it in the
# team, the coordinator runs it once the changes are done and before any review,
# reverts its cuts and sends its gaps back to the implementer once (see
# coordination/scope-guard.md.j2).
[[pipeline]]
name = "scope-guard"
archetype = "scope-guard"

[[pipeline]]
name = "reviewer"
archetype = "reviewer"

# Last: checks the others' results as a skeptic and outside attacker. With it in
# the team, the coordinator runs it before its final report and sends serious
# findings back to the implementer (see coordination/adversary.md.j2).
[[pipeline]]
name = "adversary"
archetype = "adversary"

# Fallbacks. primary_model is used for the top-level "model" when no agent is
# primary; utility_provider/utility_model drive the compaction/title/summary agents.
[defaults]
primary_model = "qwen3-35b-a3b"
utility_provider = "mac"
utility_model = "qwen3.5-9b"
