# Skill presets for `ocgen add skill`. Each seeds a SKILL.md with sensible
# frontmatter and a body as strict as its risk: exact steps with a check that
# loops back for side effects, plain principles for judgment calls. Fully
# editable (copy out with `ocgen templates init`). `body` is language-keyed;
# falls back to English.

[[preset]]
name = "command"
choose_when = "a procedure you run by name (/name) that has side effects; it never runs on its own"
description = "Run this git task step by step when the user types its /name; Claude never starts it on its own."
allowed_tools = "Bash(git status:*), Bash(git add:*), Bash(git commit:*)"
disable_model_invocation = true
[preset.body]
English = """Run this task exactly as written: its steps have side effects, so don't skip, reorder or
improvise one.

1. Review the current state (e.g. `git status`).
2. Make the change described by $ARGUMENTS.
3. Check the result: run `git status` and compare it with $ARGUMENTS. If it doesn't match, go back
   to step 2 — at most 2 more tries; then stop and report what is still wrong.
4. Report what you did."""
Ukrainian = """Виконай задачу точно як написано: її кроки мають побічні ефекти, тож не пропускай, не
переставляй і не вигадуй жодного.

1. Переглянь поточний стан (наприклад, `git status`).
2. Зроби зміну, описану в $ARGUMENTS.
3. Перевір результат: запусти `git status` і порівняй його з $ARGUMENTS. Якщо не збігається,
   повернися до кроку 2 — щонайбільше ще 2 спроби; тоді зупинись і повідом, що досі не так.
4. Звітуй, що зроблено."""

[[preset]]
name = "knowledge"
choose_when = "conventions or domain rules Claude should apply automatically when relevant"
description = "Conventions and gotchas for <topic>. Use when working on <topic> or when its rules apply."
[preset.body]
English = """Guidance for <topic>. These are principles with their reasons, not a fixed procedure:
apply them with judgment.

- Key convention or rule.
- Another rule, with a short rationale.
- A gotcha to avoid."""
Ukrainian = """Настанови щодо <теми>. Це принципи з поясненням причин, а не жорстка процедура:
застосовуй їх зважено.

- Ключове правило чи домовленість.
- Ще одне правило з коротким обґрунтуванням.
- Пастка, якої слід уникати."""

[[preset]]
name = "improve-prompt"
choose_when = "rewriting a prompt or an agent's system prompt on request; asks before writing back"
description = "Improve a prompt or an agent's system prompt using Anthropic's technique. Run it with /name on the prompt to sharpen."
allowed_tools = "Read, Edit, Write, Grep, Glob"
disable_model_invocation = true
[preset.body]
English = """Improve the prompt in $ARGUMENTS (inline text, a file path, or an agent name).
For an agent/skill file, improve only the system-prompt body and preserve the YAML frontmatter.

Apply Anthropic's technique:
1. State the role, task, and success criteria; remove ambiguity.
2. Structure sections with XML tags (<context>, <instructions>, <example>, <output_format>).
3. Add step-by-step reasoning where it helps; give 1-3 few-shot examples when useful.
4. Specify the output format; keep it concise and current.

Show the improved prompt and a short rationale, then ask before writing any file back."""
Ukrainian = """Покращ промпт із $ARGUMENTS (текст, шлях до файлу або імʼя агента).
Для файлу агента/скіла покращуй лише тіло системного промпту, зберігаючи YAML-фронтметр.

Застосуй техніку Anthropic:
1. Чітко визнач роль, задачу і критерії успіху; прибери неоднозначність.
2. Структуруй розділи XML-тегами (<context>, <instructions>, <example>, <output_format>).
3. Додай покрокові міркування, де це доречно; 1-3 приклади, коли корисно.
4. Визнач формат виводу; тримай стисло й актуально.

Покажи покращений промпт і коротке обґрунтування, тоді спитай дозволу перед записом у файл."""

[[preset]]
name = "forked-research"
choose_when = "heavy reading across many files in an isolated subagent; you get a summary back"
description = "Research a topic thoroughly in an isolated subagent. Use when a question needs broad reading across many files."
context_fork = true
agent = "Explore"
[preset.body]
English = """Research $ARGUMENTS thoroughly:

1. Find relevant files with Glob and Grep.
2. Read and analyze the code.
3. Check each claim against the file you cite; mark what you couldn't confirm as unconfirmed, or
   drop it.
4. Summarize findings with specific file references."""
Ukrainian = """Досліди $ARGUMENTS ретельно:

1. Знайди релевантні файли через Glob і Grep.
2. Прочитай і проаналізуй код.
3. Звір кожне твердження з файлом, на який посилаєшся; те, що не вдалося підтвердити, познач як
   непідтверджене або прибери.
4. Зведи висновки з посиланнями на конкретні файли."""
