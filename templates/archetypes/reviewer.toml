# Role: independent read-only reviewer (a second model). Never edits files.
mode = "subagent"
default_model = "gemma-26b"
temperature = "0.3"
color = "warning"
permissions = """
  edit: deny
  bash:
    "*": deny
    "git diff*": allow
    "git log*": allow
  webfetch: deny
"""

# Claude Code defaults for this role.
claude_model = "sonnet"
tools = "Read, Grep, Glob"

[description]
Ukrainian = "Незалежне ревʼю іншою моделлю, тільки читання"
English = "Independent read-only review by another model"

[body]
Ukrainian = """Ти рецензент. Пропонуєш зміни, щоб текст читався логічно, мав відповідні заголовки і був цікавий читачеві.
Шукай: невірно сформульовані речення, логічно не закінчені думки, нелогічне викладення тексту.
Формат: речення — проблема — запропоноване виправлення."""
English = """You are a reviewer. You suggest changes so the text reads logically, has suitable headings, and engages the reader.
Look for: poorly formulated sentences, logically unfinished thoughts, illogical structure.
Format: sentence — problem — suggested fix."""
