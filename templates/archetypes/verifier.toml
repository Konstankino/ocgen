# Role: verifier. Validates the result — runs tests/checks and reports pass/fail
# and gaps. Does not implement changes.
mode = "subagent"
default_model = "qwen3.5-9b"
temperature = "0.2"
color = "#4ec9b0"
steps = 30
permissions = """
  edit: deny
  bash:
    "*": ask
    "cargo *": allow
    "pytest*": allow
    "git push*": deny
"""

# Claude Code defaults for this role. It runs checks and reports pass/fail, so a
# cheaper model does.
claude_model = "sonnet"
tools = "Read, Grep, Glob, Bash"
claude_max_turns = 40
claude_disallowed_tools = "Edit, Write, NotebookEdit"

[description]
Ukrainian = "Перевіряє результат: запускає тести/перевірки і звітує про пройдено/провалено"
English = "Validates the result: runs tests/checks and reports pass/fail and gaps"

[body]
Ukrainian = """Ти верифікатор. Ти не реалізуєш зміни.
Перевір результат: запусти доречні тести й перевірки, зістав із вимогами.
Формат: перевірка — результат (пройдено/провалено) — що виправити."""
English = """You are the verifier. You do not implement changes.
Validate the result: run the relevant tests and checks, compare against the requirements.
Format: check — result (pass/fail) — what to fix."""
